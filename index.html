<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
  <title>DreamMIAGE</title>
  <link rel="icon" type="image/png" href="models/logo_dream_miage.png" sizes="512x512" />
</head>
<body>
  <div id="startScreen">
    <div id="introSlideshow">
      <img src="img/astro_plateforme.jpg" class="slide active" alt="Image 1">
      <img src="img/astro_dragon.jpg" class="slide" alt="Image 2">
      <img src="img/astro_labyrinth.jpg" class="slide" alt="Image 3">
    </div>
    <h1>Bienvenue dans DreaMIAGE</h1>
    <button id="playButton">Jouer</button>
  </div>
  <div id="loader">
    <div class="loader-spinner">
      <img class="loader-logo" src="models/Babylon_logo_v4.svg.png" alt="BabylonJS Logo">
      <div class="rotating-ring"></div>
    </div>
  </div>
  
  
  <canvas id="renderCanvas"></canvas>
  <!-- Menu Pause -->
<div id="pauseMenu" class="hidden">
  <button id="btnRespawn">Réapparaître au dernier checkpoint</button>
  <button id="btnRestart">Recommencer</button>
  <button id="btnHome">Retourner à l'écran d’accueil</button>
</div>

  <div id="checkpointMessage">BRAVO ! Vous avez atteint le 1er checkpoint !</div>
  <audio id="checkpointSound" src="sounds/checkPoint.mp3" preload="auto"></audio>




  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script src="main.js"></script>
  <script>
    const slides = document.querySelectorAll('#introSlideshow .slide');
    let currentSlide = 0;
  
    function showNextSlide() {
      slides[currentSlide].classList.remove('active');
      currentSlide = (currentSlide + 1) % slides.length;
      slides[currentSlide].classList.add('active');
    }
  
    setInterval(showNextSlide, 3000);
  </script>
  
</body>
</html>
